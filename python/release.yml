# Example caller workflow for Python releases
# This file shows how to use the reusable Python release workflow
#
# Place this file at: .github/workflows/release.yml

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'  # Pre-releases like v0.1.0-alpha

permissions:
  contents: write
  id-token: write  # For PyPI trusted publishing

jobs:
  python-release:
    uses: jade-codes/syster-pipelines/.github/workflows/python-release.yml@main
    # with:
    #   working-directory: '.'  # Optional: if not in repo root
    secrets:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
